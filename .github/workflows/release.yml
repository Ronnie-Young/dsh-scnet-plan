name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install --no-audit --no-fund
      - run: npm test

      - name: Resolve and verify the version tag
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}" >&2
            exit 1
          fi

      - name: Stamp the build commit
        run: sed -i "s/__SCNET_BUILD__/${GITHUB_SHA::7}/g" client.js

      - name: Build the tarball
        run: npm pack

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "dsh-scnet-plan $TAG" --generate-notes
          gh release upload "$TAG" ./*.tgz --clobber

      # 可选：仓库配置 NPM_TOKEN secret 后自动发布到 npm。
      - name: Publish to npm (optional)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN 未配置，跳过 npm 发布"
            exit 0
          fi
          npm publish --access public

      # 可选：配置 MARKET_TOKEN（有 dsh-plugins-market 写权限的 PAT）后，发版即时通知市场同步。
      - name: Notify the plugin market (optional)
        env:
          MARKET_TOKEN: ${{ secrets.MARKET_TOKEN }}
        run: |
          if [ -z "$MARKET_TOKEN" ]; then
            echo "MARKET_TOKEN 未配置；市场索引由每小时同步任务更新"
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $MARKET_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Ronnie-Young/dsh-plugins-market/dispatches \
            -d '{"event_type":"plugin-release"}'
